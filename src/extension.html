<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
    <style>
        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            background: var(--vscode-editor-background)
        }

        #bar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 6px
        }

        #legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: 8px
        }

        #legend label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer
        }

        .sw {
            width: 12px;
            height: 3px;
            display: inline-block;
            border-radius: 2px
        }

        button {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: 0;
            padding: 3px 10px;
            cursor: pointer;
            border-radius: 2px;
            min-width: 28px
        }

        button:hover {
            background: var(--vscode-button-hoverBackground)
        }

        #state {
            opacity: .75;
            font-size: 12px
        }

        #wrap {
            flex: 1;
            position: relative;
            min-height: 0
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair
        }

        #sb {
            margin: 2px 15px 0 55px;
            height: 16px;
            overflow-x: auto;
            overflow-y: hidden
        }

        #sbIn {
            height: 1px
        }
    </style>
</head>

<body>
    <div id="bar">
        <button id="zout" title="Uzaklaştır (Ctrl + tekerlek / pinch)">&minus;</button>
        <button id="zin" title="Yakınlaştır (Ctrl + tekerlek / pinch)">+</button>
        <button id="fit" title="Tüm veriyi sığdır">Sığdır</button>
        <button id="live" title="En sağa git ve otomatik takibe dön" style="display:none">Canlıya dön</button>
        <button id="clear">Temizle</button>
        <span id="state"></span>
        <div id="legend"></div>
    </div>
    <div id="wrap"><canvas id="cv"></canvas></div>
    <div id="sb">
        <div id="sbIn"></div>
    </div>
    <script nonce="{{nonce}}">
        const L = 55, R = 15, T = 10, B = 28;
        const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
        const legend = document.getElementById('legend');
        const sb = document.getElementById('sb'), sbIn = document.getElementById('sbIn');
        const stateEl = document.getElementById('state'), liveBtn = document.getElementById('live');
        const COLORS = ['#4e79a7', '#f28e2b', '#e15759', '#76b7b2', '#59a14f', '#edc948', '#b07aa1', '#ff9da7', '#9c755f', '#bab0ac'];
        const MAX = 20000;
        const MIN_SPAN = 0.05;               // en fazla bu kadar saniyeye kadar yakınlaşılır
        const series = new Map();            // key -> {color, visible, pts:[[sec, value]]}

        let t0 = null, hoverX = null, raf = 0;
        let span = null;       // görünen süre (sn). null => tüm veri sığdırılır
        let left = 0;          // görünen aralığın sol ucu (span != null iken)
        let follow = true;     // true: yeni veri geldikçe sağ uca kaydır
        let dMin = 0, dMax = 0;
        let lastSet = 0;       // scrollbar'a kodla verilen son değer
        let drag = null;

        const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
        const fmt = v => String(+v.toPrecision(4));
        const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
        const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
        const plotW = () => Math.max(1, cv.clientWidth - L - R);

        // pts x'e göre sıralı: x'ten küçük olmayan ilk indis
        function lb(pts, x) {
            let lo = 0, hi = pts.length;
            while (lo < hi) { const m = (lo + hi) >> 1; if (pts[m][0] < x) lo = m + 1; else hi = m; }
            return lo;
        }

        function dataRange() {
            let mn = Infinity, mx = -Infinity;
            for (const s of series.values()) {
                if (!s.pts.length) continue;
                mn = Math.min(mn, s.pts[0][0]);
                mx = Math.max(mx, s.pts[s.pts.length - 1][0]);
            }
            if (mn === Infinity) { mn = 0; mx = 0; }
            dMin = mn; dMax = mx;
        }

        // Şu an görünen [x0, x1] aralığı
        function view() {
            const total = dMax - dMin;
            if (total <= 0) return [dMin, dMin + 1];
            if (span === null || span >= total) { left = dMin; return [dMin, dMax]; }
            if (follow) left = dMax - span;
            left = clamp(left, dMin, dMax - span);
            return [left, left + span];
        }

        const atRightEnd = () => (dMax - left - span) <= span * 0.003;

        function zoom(factor, anchor) {
            const total = dMax - dMin;
            if (total <= 0) return;
            const [a, b] = view();
            const cur = b - a;
            let ns = cur * factor;
            if (ns >= total) { span = null; follow = true; schedule(); return; }
            ns = Math.max(ns, MIN_SPAN);
            // Canlı takipteyken sağ ucu sabit tut değilse imlecin altındaki nokta sabit kalsın
            const f = follow ? 1 : anchor;
            const xa = a + f * cur;
            span = ns;
            left = clamp(xa - f * ns, dMin, dMax - ns);
            if (!follow) follow = atRightEnd();
            schedule();
        }

        function panBy(dxSec) {
            const total = dMax - dMin;
            if (span === null || span >= total) return;
            const [a] = view();
            left = clamp(a + dxSec, dMin, dMax - span);
            follow = atRightEnd();   // manuel scroll varsa otomatik takip durur
            schedule();
        }

        function renderLegend() {
            legend.innerHTML = '';
            for (const [k, s] of series) {
                const l = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox'; cb.checked = s.visible;
                cb.onchange = () => { s.visible = cb.checked; schedule(); };
                const sw = document.createElement('span');
                sw.className = 'sw'; sw.style.background = s.color;
                l.append(cb, sw, document.createTextNode(k));
                legend.append(l);
            }
        }

        window.addEventListener('message', e => {
            const m = e.data;
            if (m.type === 'sample') {
                if (t0 === null) t0 = m.t;
                const x = (m.t - t0) / 1000;
                for (const [k, v] of Object.entries(m.values)) {
                    let s = series.get(k);
                    if (!s) { s = { color: COLORS[series.size % COLORS.length], visible: true, pts: [] }; series.set(k, s); renderLegend(); }
                    s.pts.push([x, v]);
                    if (s.pts.length > MAX) s.pts.splice(0, s.pts.length - MAX);
                }
                schedule();
            } else if (m.type === 'clear') clearAll();
        });

        function clearAll() {
            series.clear(); t0 = null; span = null; left = 0; follow = true;
            renderLegend(); schedule();
        }

        // ---- Kontroller ----
        document.getElementById('clear').onclick = clearAll;
        document.getElementById('zin').onclick = () => zoom(0.6, 0.5);
        document.getElementById('zout').onclick = () => zoom(1 / 0.6, 0.5);
        document.getElementById('fit').onclick = () => { span = null; follow = true; schedule(); };
        liveBtn.onclick = () => { follow = true; schedule(); };

        cv.addEventListener('mousemove', e => { hoverX = e.offsetX; schedule(); });
        cv.addEventListener('mouseleave', () => { hoverX = null; schedule(); });

        cv.addEventListener('wheel', e => {
            e.preventDefault();
            if (e.ctrlKey || e.metaKey) {              // Ctrl + tekerlek ya da trackpad pinch => zoom
                const factor = clamp(Math.exp(e.deltaY * 0.0025), 0.5, 2);
                zoom(factor, clamp((e.offsetX - L) / plotW(), 0, 1));
            } else {                                   // tekerlek / yatay trackpad kaydırma => pan
                const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
                const [a, b] = view();
                panBy(d / plotW() * (b - a));
            }
        }, { passive: false });

        cv.addEventListener('mousedown', e => { if (e.button === 0) { drag = { x: e.clientX }; cv.style.cursor = 'grabbing'; } });
        window.addEventListener('mouseup', () => { drag = null; cv.style.cursor = ''; });
        window.addEventListener('mousemove', e => {
            if (!drag) return;
            const [a, b] = view();
            panBy(-(e.clientX - drag.x) / plotW() * (b - a));
            drag.x = e.clientX;
        });

        // Yatay scrollbar: kullanıcı kaydırınca left güncellenir
        sb.addEventListener('scroll', () => {
            if (Math.abs(sb.scrollLeft - lastSet) < 1) return;   // kodla verilen değer
            const total = dMax - dMin;
            if (span === null || span >= total) return;
            const innerW = sbIn.offsetWidth;
            left = dMin + sb.scrollLeft / innerW * total;
            follow = sb.scrollLeft >= innerW - sb.clientWidth - 2;
            lastSet = sb.scrollLeft;
            schedule();
        });

        function syncScroll(x0, x1, pw) {
            const total = dMax - dMin;
            const scrollable = total > 0 && span !== null && span < total;
            sb.style.visibility = scrollable ? 'visible' : 'hidden';
            if (!scrollable) { sbIn.style.width = '1px'; lastSet = sb.scrollLeft; return; }
            const innerW = Math.min(1e7, pw * total / (x1 - x0));
            sbIn.style.width = innerW + 'px';
            const target = (x0 - dMin) / total * innerW;
            if (Math.abs(sb.scrollLeft - target) > 0.5) sb.scrollLeft = target;
            lastSet = sb.scrollLeft;
        }

        function updateState() {
            const total = dMax - dMin;
            if (span === null || span >= total) stateEl.textContent = 'Tüm veri gösteriliyor';
            else stateEl.textContent = follow ? '\u25CF Canlı takip' : '\u23F8 Otomatik kaydırma durdu';
            liveBtn.style.display = (span !== null && span < total && !follow) ? '' : 'none';
        }

        new ResizeObserver(schedule).observe(document.getElementById('wrap'));

        function draw() {
            const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
            cv.width = w * dpr; cv.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);
            const fg = css('--vscode-foreground') || '#ccc';
            const pw = w - L - R, ph = h - T - B;
            ctx.font = '11px sans-serif';

            dataRange();
            const [x0, x1] = view();
            syncScroll(x0, x1, plotW());
            updateState();

            let any = false;
            for (const s of series.values()) if (s.pts.length) any = true;
            if (!any) {
                ctx.fillStyle = fg; ctx.globalAlpha = .6;
                ctx.fillText('Veri bekleniyor…  (>>key:value,key:value;)', L, T + 20);
                ctx.globalAlpha = 1; return;
            }

            // Görünen aralıktaki noktalar ve y ekseni aralığı
            let y0 = Infinity, y1 = -Infinity;
            const slices = [];
            for (const s of series.values()) {
                if (!s.visible || !s.pts.length) continue;
                const i0 = Math.max(0, lb(s.pts, x0) - 1), i1 = Math.min(s.pts.length, lb(s.pts, x1) + 1);
                slices.push([s, i0, i1]);
                for (let i = i0; i < i1; i++) { const y = s.pts[i][1]; if (y < y0) y0 = y; if (y > y1) y1 = y; }
            }
            if (y0 === Infinity) { y0 = 0; y1 = 1; }
            if (y1 === y0) { y0 -= 1; y1 += 1; } else { const p = (y1 - y0) * .08; y0 -= p; y1 += p; }
            const X = x => L + (x - x0) / (x1 - x0) * pw;
            const Y = y => T + ph - (y - y0) / (y1 - y0) * ph;

            // grid + eksen etiketleri
            ctx.strokeStyle = 'rgba(128,128,128,.25)'; ctx.fillStyle = fg; ctx.lineWidth = 1;
            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const v = y0 + (y1 - y0) * i / 5, y = Y(v);
                ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
                ctx.fillText(fmt(v), L - 6, y + 4);
            }
            ctx.textAlign = 'center';
            const step = (x1 - x0) / 6;
            const dec = Math.max(0, Math.min(4, Math.ceil(-Math.log10(step)) + 1));
            for (let i = 0; i <= 6; i++) {
                const v = x0 + step * i, x = X(v);
                ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
                ctx.fillText(v.toFixed(dec) + 's', x, T + ph + 16);
            }

            // çizgiler
            ctx.save(); ctx.beginPath(); ctx.rect(L, T, pw, ph); ctx.clip();
            ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
            for (const [s, i0, i1] of slices) {
                ctx.strokeStyle = s.color; ctx.beginPath();
                for (let i = i0; i < i1; i++) {
                    const px = X(s.pts[i][0]), py = Y(s.pts[i][1]);
                    if (i === i0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();
                if ((i1 - i0) * 8 < pw) {   // nokta seyrekse işaretçi çiz
                    ctx.fillStyle = s.color;
                    for (let i = i0; i < i1; i++) { ctx.beginPath(); ctx.arc(X(s.pts[i][0]), Y(s.pts[i][1]), 2.5, 0, 7); ctx.fill(); }
                }
            }
            ctx.restore();

            // tooltip
            if (hoverX !== null && !drag && hoverX >= L && hoverX <= L + pw) {
                const xv = x0 + (hoverX - L) / pw * (x1 - x0);
                const rows = [];
                for (const [k, s] of series) {
                    if (!s.visible || !s.pts.length) continue;
                    const j = lb(s.pts, xv);
                    let best = s.pts[Math.min(j, s.pts.length - 1)];
                    if (j > 0 && Math.abs(s.pts[j - 1][0] - xv) < Math.abs(best[0] - xv)) best = s.pts[j - 1];
                    rows.push([k, best, s.color]);
                }
                if (rows.length) {
                    const gx = X(rows[0][1][0]);
                    ctx.strokeStyle = 'rgba(128,128,128,.6)';
                    ctx.beginPath(); ctx.moveTo(gx, T); ctx.lineTo(gx, T + ph); ctx.stroke();
                    const lines = ['t = ' + rows[0][1][0].toFixed(2) + 's', ...rows.map(r => r[0] + ': ' + fmt(r[1][1]))];
                    const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 14, bh = lines.length * 15 + 8;
                    let bx = gx + 10; if (bx + bw > w - 4) bx = gx - bw - 10;
                    ctx.fillStyle = css('--vscode-editorHoverWidget-background') || '#252526';
                    ctx.strokeStyle = css('--vscode-editorHoverWidget-border') || '#555';
                    ctx.fillRect(bx, T + 4, bw, bh); ctx.strokeRect(bx, T + 4, bw, bh);
                    ctx.textAlign = 'left';
                    lines.forEach((l, i) => { ctx.fillStyle = i ? rows[i - 1][2] : fg; ctx.fillText(l, bx + 7, T + 20 + i * 15); });
                    for (const [, p, c] of rows) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 3.5, 0, 7); ctx.fill(); }
                }
            }
        }
        draw();
    </script>
</body>

</html>
